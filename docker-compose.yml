version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: heartguard_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: heartguard_db
    volumes:
      - mongo_data:/data/db

  # 2. FastAPI ML Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heartguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=heartguard_db
      - ENVIRONMENT=production
    depends_on:
      - mongodb

  # 3. React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heartguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
