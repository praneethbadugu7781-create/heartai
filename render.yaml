services:
  # 1. FastAPI Python ML Backend
  - type: web
    name: heartguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python train_models.py"
    startCommand: "cd backend && python run_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

  # 2. React TypeScript Frontend
  - type: web
    name: heartguard-web
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
